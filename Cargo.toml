[package]
name = "stacky-notes"
version = "0.1.0"
edition = "2024"
description = "Schnell Notes für Substack posten (inoffiziell)"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# rustls statt OpenSSL: keine Systembibliothek nötig.
# platform-verifier: nutzt die Zertifikate des Betriebssystems
# (wichtig bei Virenscannern oder Firmen-Proxys, die HTTPS prüfen).
ureq = { version = "3.5.1", features = ["json", "platform-verifier"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
